# Automatically tests that the install scripts actually run cleanly on
# real Windows and real Mac machines, for free, every time this repo
# changes. This does NOT click anything or verify the double-click
# experience — it just proves the commands themselves succeed, so
# obvious bugs get caught before a real person ever tries this.

name: Test setup scripts

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you also trigger it manually from GitHub's UI

jobs:
  test-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Mac setup script
        run: |
          chmod +x setup-mac.sh
          ./setup-mac.sh
      - name: Confirm the agent actually starts
        run: |
          ./venv/bin/python3 main.py > agent.log 2> agent_err.log &
          AGENT_PID=$!
          UP=0
          for i in $(seq 1 20); do
            if curl -k -f -s https://127.0.0.1:8765/ping > /dev/null; then
              UP=1
              echo "Agent is up after $((i * 3))s"
              break
            fi
            if ! kill -0 $AGENT_PID 2>/dev/null; then
              echo "Agent process exited early."
              break
            fi
            sleep 3
          done
          if [ "$UP" -ne 1 ]; then
            echo "Agent never responded to /ping. Logs:"
            cat agent.log agent_err.log
            exit 1
          fi
          kill $AGENT_PID 2>/dev/null || true

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows setup script
        run: .\setup-windows.bat
        shell: cmd
      - name: Confirm the agent actually starts
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = {$true}
          $proc = Start-Process -FilePath "venv\Scripts\python.exe" -ArgumentList "main.py" `
            -RedirectStandardOutput agent.log `
            -RedirectStandardError agent_err.log `
            -NoNewWindow -PassThru
          $up = $false
          for ($i = 1; $i -le 20; $i++) {
            try {
              Invoke-WebRequest -Uri https://127.0.0.1:8765/ping -UseBasicParsing -TimeoutSec 5 | Out-Null
              $up = $true
              Write-Host "Agent is up after $($i * 3)s"
              break
            } catch {
              if ($proc.HasExited) {
                Write-Host "Agent process exited early with code $($proc.ExitCode)."
                break
              }
              Start-Sleep -Seconds 3
            }
          }
          if (-not $up) {
            Write-Host "Agent never responded to /ping. Logs:"
            Get-Content agent.log, agent_err.log
            exit 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
